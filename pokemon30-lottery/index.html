<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケカ30周年 抽選トラッカー</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}.sub{color:#aab4d0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.box,.card{background:#121a2f;border:1px solid #263252;border-radius:16px;padding:14px}.box b{font-size:26px;display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card.done{opacity:.6}.head{display:flex;justify-content:space-between;gap:8px}.deadline{color:#fde68a;font-weight:700}.cond{background:#17213b;border-radius:12px;padding:10px;margin:10px 0;line-height:1.5}.steps{display:grid;gap:7px}.step{display:flex;gap:8px;align-items:flex-start}.step input,.finish input{width:20px;height:20px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{color:#bae6fd;text-decoration:none;border:1px solid #315179;padding:8px 10px;border-radius:10px}.finish{margin-top:12px;padding-top:10px;border-top:1px solid #263252;font-weight:800;display:flex;gap:8px}.note{font-size:12px;color:#aab4d0;margin-top:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="top"><div><h1>ポケカ30周年 抽選トラッカー</h1><div class="sub">ポケモンセンターオンライン以外。応募までの手順と完了状況を保存。</div></div></div><section class="summary"><div class="box">掲載<b id="all">0</b></div><div class="box">応募完了<b id="done">0</b></div><div class="box">進捗<b id="pct">0%</b></div></section><section id="grid" class="grid"></section><div class="note">チェック状態はこのブラウザの localStorage に保存されます。別端末・別ブラウザには同期されません。情報は2026-09-05時点。応募直前に公式告知を再確認してください。</div></main><script>const items=[{id:'mint',name:'MINT 吉祥寺店',product:'30th BOX / エーフィ・ブラッキー / カードセット各種',deadline:'9/11 23:59',cond:'MINTメンバーズアプリ会員番号＋店舗Xフォロー。購入時は登録情報と一致する身分証・当選メール確認。',url:'https://mint-web.jp/',steps:['MINTメンバーズアプリを入れる','会員登録','MINT吉祥寺店のXをフォロー','抽選フォームから応募','当選結果を確認']},{id:'jtc',name:'Japan TCG Center 吉祥寺',product:'30th BOX',deadline:'9/8 21:00',cond:'店舗Xフォロー＋対象投稿RP。公開Xアカウント必須。',url:'https://x.com/',steps:['Xアカウントを公開状態にする','店舗公式Xをフォロー','対象投稿をRP','当選DMを受け取れる設定にする','当選時に本人確認書類を持って店頭購入']},{id:'hareruya2',name:'晴れる屋2',product:'30th BOX / エーフィ・ブラッキー',deadline:'9/7 18:00',cond:'晴れる屋2 LINE会員＋LivePocketアカウント。',url:'https://www.hareruya2.com/en/pages/146654363968',steps:['晴れる屋2 LINE会員登録','LivePocketアカウント作成','対象商品を選択','抽選応募','当選結果を確認']},{id:'furuichi',name:'古本市場 / ふるいち',product:'30th BOX / エーフィ・ブラッキー',deadline:'9/6 23:00',cond:'ふるいちポイントアプリの登録会員番号が必要。',url:'https://www.furu1.net/',steps:['ふるいちポイントアプリを入れる','会員登録','会員番号を確認','抽選ページから応募','当選店舗で購入']},{id:'surugaya',name:'駿河屋',product:'30th BOX',deadline:'9/6 23:59',cond:'駿河屋通販トレカ公式Xをフォロー＋対象投稿RP＋応募フォーム。',url:'https://www.suruga-ya.jp/',steps:['Xアカウント準備','駿河屋通販トレカ公式Xをフォロー','対象投稿をRP','応募フォーム入力','当選結果確認']},{id:'bic',name:'ビックカメラ',product:'30th BOX / エーフィ・ブラッキー',deadline:'9/6 各店閉店まで',cond:'ポイントカード会員＋指定期間の購入履歴＋本人確認書類。新規会員だけでは厳しい。',url:'https://www.biccamera.com/',steps:['購入履歴が条件を満たすか確認','対象店舗の条件確認','本人確認書類準備','店舗で抽選受付','当選確認']},{id:'famima',name:'ファミマオンライン',product:'30th BOX',deadline:'9/10 23:59',cond:'ファミマオンライン会員＋メールマガジン登録。',url:'https://famima-online.family.co.jp/',steps:['ファミマオンライン会員登録','メルマガ登録確認','30th抽選商品ページを開く','応募','当選時に指定店舗で受取']},{id:'cardmax',name:'CARDMAX',product:'30th BOX',deadline:'9/13 23:59',cond:'対象期間中に通販または秋葉原店で税込300円以上購入。',url:'https://www.cardmax.jp/',steps:['通販または店舗利用を選ぶ','300円以上購入','店頭ならポイントカード作成','抽選フォーム応募','当選確認']},{id:'magi',name:'magi',product:'30th BOX / エーフィ・ブラッキー',deadline:'9/15 23:59',cond:'magiアプリ会員＋指定Xアカウントのフォロー・RP。',url:'https://magi.camp/',steps:['magiアプリ会員登録','指定Xをフォロー','対象投稿をRP','応募フォーム入力','当選確認']},{id:'future',name:'magi 立川系',product:'FUTURISTIC BOX',deadline:'9/16 23:59',cond:'指定2店舗のXフォロー＋指定投稿RP。',url:'https://magi.camp/news/1206/web',steps:['対象Xをフォロー','指定投稿をRP','応募条件を再確認','応募','当選確認']},{id:'amazon',name:'Amazon',product:'30th関連各種',deadline:'未定',cond:'招待販売。Amazonアカウントから招待をリクエスト。',url:'https://www.amazon.co.jp/',steps:['Amazonへログイン','対象商品の招待販売ページを探す','招待をリクエスト','招待メール確認','招待後に購入']},{id:'takashimaya',name:'新宿高島屋',product:'30th CELEBRATION 5パックまで',deadline:'9/10 19:30',cond:'LivePocketで本人応募。9/16来店受取。',url:'https://www.takashimaya.co.jp/shinjuku/',steps:['LivePocketアカウント作成','新宿高島屋の抽選ページを開く','応募','当選確認','9/16に本人来店']}] ;const key='pokemon30-progress-v1';let state=JSON.parse(localStorage.getItem(key)||'{}');const g=document.getElementById('grid');function save(){localStorage.setItem(key,JSON.stringify(state));render()}function render(){g.innerHTML='';let done=0,checks=0,total=0;items.forEach(it=>{const s=state[it.id]||{};const card=document.createElement('article');card.className='card'+(s.finish?' done':'');let h='<div class="head"><div><h2>'+it.name+'</h2><div>'+it.product+'</div></div><div class="deadline">'+it.deadline+'</div></div><div class="cond">'+it.cond+'</div><div class="steps">';it.steps.forEach((x,i)=>{total++;if(s[i])checks++;h+='<label class="step"><input type="checkbox" data-id="'+it.id+'" data-step="'+i+'" '+(s[i]?'checked':'')+'>'+x+'</label>'});h+='</div><div class="links"><a target="_blank" rel="noopener" href="'+it.url+'">応募・公式ページを開く</a></div><label class="finish"><input type="checkbox" data-id="'+it.id+'" data-finish="1" '+(s.finish?'checked':'')+'>応募完了</label>';card.innerHTML=h;g.appendChild(card);if(s.finish)done++});document.getElementById('all').textContent=items.length;document.getElementById('done').textContent=done;document.getElementById('pct').textContent=Math.round((checks+done)/(total+items.length)*100)+'%';document.querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=()=>{const id=el.dataset.id;state[id]=state[id]||{};if(el.dataset.finish)state[id].finish=el.checked;else state[id][el.dataset.step]=el.checked;save()})}render();</script></body></html>
